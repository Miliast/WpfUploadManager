name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Publish app (win-x64, framework-dependent)
        run: dotnet publish src/UploadManager.App/UploadManager.App.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - uses: actions/upload-artifact@v7
        with:
          name: UploadManager-win-x64
          path: publish

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
